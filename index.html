<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3a2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clubhouse" />
    <link rel="icon" href="/icons/crest.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>Clubhouse</title>
    <script src="/boot.js"></script>
    <style>
      #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#1f3a2c;color:#efe8d8;transition:opacity .5s cubic-bezier(.4,0,.2,1)}
      #splash img{width:112px;height:auto}
      #splash .wm{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:28px;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
      #splash .rule{width:56px;height:1px;background:#b5945b}
      #splash .est{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:12px;letter-spacing:.4em;color:#b5945b;padding-left:.4em}
      #splash.gone{opacity:0;pointer-events:none}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icons/crest.svg" alt="" />
      <div class="wm">Clubhouse</div>
      <div class="rule"></div>
      <div class="est">EST. 2026</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
